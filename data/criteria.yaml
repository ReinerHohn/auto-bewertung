# Deine Bewertungskriterien. Gewichte muessen sich nicht auf 1 summieren
# (werden automatisch normalisiert). Anpassen und `rank`/Dashboard neu laden.

weights:
  tco: 0.26                # komplette Haltekosten pro Jahr (guenstig = gut)
  value_stability: 0.12    # Wertstabilitaet (geringer Wertverlust = gut)
  equipment: 0.14          # gewuenschte Assistenz vorhanden, keine teure Matrix-LED
  reliability: 0.18        # Pannen-/Maengelquote (wenig Pannen = gut)
  weak_points: 0.10        # bekannte Schwachstellen + Rueckrufe
  price_value: 0.08        # Schnaeppchen: Preis unter Marktwert + fallender Trend
  parts_availability: 0.06 # Ersatzteil-Verfuegbarkeit
  workshop_access: 0.06    # Werkstattdichte/Spezialisten in der Naehe

# Gewuenschte Ausstattung (Pflicht-/Wunsch) und teure Extras vermeiden
want_features: [einparkhilfe, rueckfahrkamera, notbremsassistent, spurhalteassistent]
avoid_matrix: true         # teure Matrix-/Voll-LED-Scheinwerfer meiden

# --- Harte Kriterien --------------------------------------------------------
max_price: 15000           # Budget fuer Verbrenner (E-Autos siehe Ausnahme)
min_vehicle_class: kompakt # ab Golf/Auris-Klasse aufwaerts

# E-Auto-Ausnahme: darf teurer als max_price sein, soweit die jaehrliche
# Ersparnis (laufende Kosten) ggue. dem Verbrenner-Median den Aufpreis ueber
# die Haltedauer deckt.
ev_price_exception: true
ev_min_charge_km_30min: 250   # E-Auto normal: >=250 km nachladbar in 30 min
# Langstrecken-Ausnahme: ab viel Reichweite reicht langsameres Laden (seltener laden)
ev_long_range_km: 400              # ab dieser Reichweite ...
ev_min_charge_km_30min_longrange: 180  # ... reichen 180 km/30 min

home_plz: "79100"          # fuer Werkstattnaehe (Freiburg)

# --- TCO-Annahmen -----------------------------------------------------------
tco:
  annual_km: 15000
  holding_years: 5
  price_benzin: 1.80       # EUR/l
  price_diesel: 1.70       # EUR/l
  # Lade-Mix beim E-Auto: Preise je Quelle ...
  price_strom_home: 0.30   # EUR/kWh zuhause
  price_strom_public: 0.55 # EUR/kWh Schnelllader
  price_strom_work: 0.0    # EUR/kWh Firma (kostenlos)
  price_strom_solar: 0.10  # EUR/kWh eigener Solarstrom
  # ... und deine Anteile (95% kostenlos in der Firma)
  share_work: 0.95
  share_home: 0.03
  share_public: 0.02
  share_solar: 0.0
  misc_per_year: 250       # Reifen, HU/AU, Kleinkram pauschal/Jahr
